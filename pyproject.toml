[project]
name = "ff-magic"
version = "0.1.0"
description = "The Fast & Furious Magic Index: scene and character improbability scores"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{name = "Tony Wu"}]
dependencies = ["pydantic>=2.8", "pyyaml>=6.0", "numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ff_magic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
