  - id: ev-hs-05
    title: Hobbs holds a Black Hawk by its chain
    sequence: Samoa finale
    depicted: >-
      The Hobbs family chains a convoy of trucks to Brixton's UH-60 Black Hawk in a cliffside tug-of-war. When the chain
      breaks, Hobbs grabs it and holds the helicopter back with his own strength.
    inferred: The chain was CGI; the helicopter, trucks and cliff road were largely practical.
    post_credit: false
    in_universe_excuse: null
    visually_unverified: [whether Hobbs is braced or anchored]
    confidence: medium
    participants: [hobbs, deckard, brixton, hattie]
    plot_sources: [hs-cbr, hs-ringer, hs-beforesafters, hs-syfy]
    components:
      - id: c1
        category: physics
        subtype: physics.forces
        claim: A chained convoy of trucks holds a Black Hawk and the pilot keeps control with a tether attached
        evidence: E2
        mu: {low: 0.5, central: 1, high: 2}
        capped: false
        reasoning: >-
          This part is roughly plausible. The Black Hawk's excess lift is about 20-40 kN, and a 9 t truck resists about
          90 kN. The real risk is dynamic rollover from a side-pulling tether, which pilots train to avoid. Judged
          about 1 in 10.
        dependence: First component.
        references: [uh60-weights]
        credits: [{character: hobbs, role: controller}, {character: deckard, role: controller}]
      - id: c2
        category: physics
        subtype: physics.forces
        claim: One man holds a helicopter that is pulling with 20-40 kN
        evidence: E2
        mu: {low: 12, central: 12, high: 12}
        capped: true
        reasoning: >-
          The heaviest deadlift ever is 510 kg, about 5 kN, lifted with legs, a bar and ideal footing. The helicopter's
          excess lift is 4-8x that, and friction under Hobbs's feet is only about 1 kN. Hard limit; capped.
        dependence: Conditional on c1 (the helicopter is tethered and flyable when the chain breaks).
        references: [deadlift-record, uh60-weights]
        credits: [{character: hobbs, role: controller}]
