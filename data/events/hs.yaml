  - id: ev-hs-02
    title: Brixton runs down a skyscraper's slanted face carrying Hattie
    sequence: CIA black site
    depicted: >-
      Brixton grabs Hattie, exits a high window, and runs down the steeply slanted exterior face of the tower to
      street level.
    inferred: The filming reference is the 225 m Leadenhall Building, whose one face slants like a wedge.
    post_credit: false
    in_universe_excuse: Cybernetically rebuilt legs and grip.
    visually_unverified: [slope angle of the face, height descended]
    confidence: low
    participants: [brixton, hattie]
    plot_sources: [hs-cbr, hs-wiki]
    components:
      - id: c1
        category: physics
        subtype: physics.forces
        claim: A runner controls his speed down a glass face far steeper than 45 degrees
        evidence: E2
        mu: {low: 12, central: 12, high: 12}
        capped: true
        reasoning: >-
          To descend without accelerating, friction must exceed tan(slope): 1.0 at 45 degrees and 5.7 at 80 degrees.
          Shoe rubber on glass gives about 0.5-1.0. Stronger legs do not change friction, so on any face steep enough to
          look like a skyscraper he is sliding at close to free fall. Hard limit; capped. Low confidence because the
          on-screen angle is not measured.
        dependence: First component.
        references: [friction-steep-face]
        credits: [{character: brixton, role: controller}, {character: hattie, role: occupant}]
