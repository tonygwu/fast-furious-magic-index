film: ff09
events:
  - id: ev-ff09-01
    title: Outrunning landmines at 80 mph
    sequence: Montequinto escape
    depicted: >-
      Fleeing soldiers, the team drives into a minefield. Tej tells everyone to stay above 80 mph "to avoid being blown
      up"; they race through as mines detonate around them. Roman's car is destroyed and he barely escapes the blast.
    inferred: ""
    post_credit: false
    in_universe_excuse: null
    visually_unverified: [whether mines detonate behind or under the cars]
    confidence: medium
    participants: [dom, letty, roman, tej, ramsey]
    plot_sources: [ff09-fandom-montequinto, ff09-themoviespoiler]
    components:
      - id: c1
        category: physics
        subtype: physics.forces
        claim: Driving fast enough to be clear of a pressure-triggered mine before it explodes
        evidence: E2
        mu: {low: 2, central: 3, high: 5}
        capped: false
        reasoning: >-
          Anti-vehicle mines fire within milliseconds of pressure; at 80 mph (36 m/s) a car moves about 4 cm per
          millisecond. Getting about 5 m clear needs a fuze delay of about 140 ms, which standard pressure fuzes do not
          have. Speed only helps if every mine in the field has an unusual delay. Judged 1 in 100 to 1 in 100,000.
        dependence: First component; one component for all cars (the mines are the same type).
        references: []
        credits: [{character: dom, role: controller}, {character: letty, role: controller}, {character: roman, role: controller}, {character: tej, role: controller}, {character: ramsey, role: occupant}]
      - id: c2
        category: survival
        subtype: survival.explosion
        claim: Roman escapes a mine blast that destroys his car
        evidence: E4
        mu: {low: 0.5, central: 1, high: 2}
        capped: false
        reasoning: Anti-vehicle mines are designed to kill a vehicle's occupants. Judgment prior about 1 in 10.
        dependence: Conditional on c1 failing locally for Roman's car (the mine catches his car but not him).
        references: []
        credits: [{character: roman, role: survivor}]
  - id: ev-ff09-02
    title: Charger swings across the gorge on the bridge's rope
    sequence: Montequinto escape
    depicted: >-
      With the rope bridge collapsed, Dom drives his Charger off the cliff toward its remains, snags a rope from the
      bridge, swings across on it and lands on the far cliffside.
    inferred: >-
      The bridge had just carried Tej's Jeep before collapsing. The Fandom sequence page puts Letty in Dom's Charger
      for this jump, after she is thrown from her motorcycle in the minefield.
    post_credit: false
    in_universe_excuse: null
    visually_unverified: [gap width]
    confidence: medium
    participants: [dom, letty]
    plot_sources: [ff09-fandom-montequinto, ff09-themoviespoiler]
    components:
      - id: c1
        category: coincidence
        subtype: coincidence.snag
        claim: A car driven off a cliff snags a dangling rope so that it is securely attached
        evidence: E4
        mu: {low: 1, central: 1.5, high: 2.5}
        capped: false
        reasoning: The rope must catch on a part of the car that holds (not slide off the bodywork). Judgment prior about 1 in 30.
        dependence: First component.
        references: []
        credits: [{character: dom, role: controller}, {character: letty, role: occupant}]
      - id: c2
        category: physics
        subtype: physics.structural
        claim: A single old bridge rope holds a 2 t car at the bottom of the swing
        evidence: E2
        mu: {low: 3, central: 5, high: 8}
        capped: false
        reasoning: >-
          Tension at the bottom of the swing is m(g + v2/L): with v = 20-30 m/s and L = 30 m that is 2 t x 23-40 m/s2 =
          46-80 kN, before the shock load of the catch. A weathered natural-fibre rope of this size breaks at roughly
          10-40 kN. The requirement is 2-8x the rope's strength. Judged 1 in 1,000 to 1 in 100 million.
        dependence: Conditional on c1.
        references: []
        credits: [{character: dom, role: controller}, {character: letty, role: occupant}]
      - id: c3
        category: coincidence
        subtype: coincidence.landing
        claim: The swing releases the car onto the far cliff rather than into its face
        evidence: E3
        mu: {low: 0.5, central: 1, high: 2}
        capped: false
        reasoning: A pendulum returns to its release height only at the same side unless the pivot and timing work out. Judged about 1 in 10.
        dependence: Conditional on c2.
        references: []
        credits: [{character: dom, role: controller}, {character: letty, role: occupant}]
