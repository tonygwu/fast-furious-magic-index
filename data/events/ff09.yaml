      Cornered at a cliff edge with the device, Jakob is picked up, car and all, by a large aircraft or drone with a
      magnet underneath.
    inferred: Sources disagree on drone vs plane and on whether he has already driven off the cliff.
    post_credit: false
    in_universe_excuse: null
