  - id: ev-ff04-02
    title: Outrun the tunnel collapse, arrive in time to save Brian
    sequence: Escape through the border tunnels
    depicted: >-
      Dom speeds out of the smuggling tunnel as it collapses behind him in an explosion, and reaches the exit just as
      Fenix, standing over the crashed Brian, is about to shoot him. Dom rams Fenix's car and kills him.
    inferred: No timing or distance figures are given.
    post_credit: false
    in_universe_excuse: null
    visually_unverified: [distance between Dom and the collapse front]
    confidence: low
    participants: [dom, brian, fenix]
    plot_sources: [ff04-wiki, ff04-screenrant-ridiculous]
    components:
      - id: c1
        category: coincidence
        subtype: coincidence.timing
        claim: The car stays ahead of a collapse and explosion front in a confined tunnel
        evidence: E3
        mu: {low: 0.5, central: 1, high: 1.5}
        capped: false
        reasoning: >-
          Deflagration and collapse fronts in tunnels can move at tens of metres per second, similar to a car. Escaping
          depends on how close the car was when the collapse started, and the film puts it just behind. Roughly 1 in 3
          to 1 in 30.
        dependence: First component.
        references: []
        credits: [{character: dom, role: controller}]
      - id: c2
        category: coincidence
        subtype: coincidence.timing
        claim: Dom arrives within the few seconds between Fenix raising his gun and firing
        evidence: E3
        mu: {low: 0.5, central: 1, high: 1.5}
        capped: false
        reasoning: >-
          If Fenix spends about 30 s over Brian and Dom's arrival time is uncertain across about 5 minutes, the chance
          of arriving inside the window is about 1 in 10.
        dependence: Independent of c1 given that Dom escapes; the collapse sets his exit time only loosely.
        references: []
        credits: [{character: dom, role: controller}, {character: brian, role: beneficiary}]
