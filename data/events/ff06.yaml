film: ff06
events:
  - id: ev-ff06-01
    title: A Chieftain tank chases sports cars down a highway
    sequence: Spanish highway tank sequence
    depicted: >-
      Shaw's crew takes a tank from a NATO convoy and drives it down a highway at the pace of the pursuing cars,
      crushing about 250 vehicles.
    inferred: The pursuing cars travel at highway speed, roughly 60 mph.
    post_credit: false
    in_universe_excuse: null
    visually_unverified: [tank speed]
    confidence: medium
    participants: [owen, letty, dom, brian, roman, tej, han, gisele, hobbs, riley]
    plot_sources: [ff06-wiki, ff06-slashfilm-tank]
    components:
      - id: c1
        category: physics
        subtype: physics.mechanical
        claim: A 56 t Chieftain sustains about 60 mph, over twice its rated 27 mph top speed
        evidence: E2
        mu: {low: 1, central: 2, high: 3}
        capped: false
        reasoning: >-
          A tracked vehicle's rolling resistance (about 0.04 x m x g = 22 kN) at 27 m/s needs about 600 kW, close to
          the Chieftain's 560 kW, so the energy budget alone is near the limit. The rated top speed comes from gearing
          and track wear, which a stolen tank cannot be modified to fix mid-heist. Judged 1 in 10 to 1 in 1,000.
        dependence: Single component.
        references: [chieftain-speed]
        credits: [{character: owen, role: controller}, {character: letty, role: occupant}]
