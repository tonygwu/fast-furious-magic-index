film: ff07
events:
  - id: ev-ff07-01
    title: Five cars parachuted onto a mountain road
    sequence: Caucasus convoy ambush
    depicted: >-
      The crew, sitting in their cars, are dropped from a C-130 over the Caucasus, parachute down, land on the
      mountain road and immediately drive into the attack on Jakande's convoy.
    inferred: Each named driver has a car (five cars); the production dropped four real cars from 12,000 ft.
    post_credit: false
    in_universe_excuse: null
    visually_unverified: [whether every car lands on the road surface itself]
    confidence: medium
    participants: [dom, brian, letty, roman, tej]
    plot_sources: [ff07-wiki, ff07-fandom, ff07-screenrant-c130]
    components:
      - id: c1
        category: coincidence
        subtype: coincidence.landing
        claim: All five cars land on (not merely near) a narrow mountain road
        evidence: E3
        mu: {low: 3, central: 4.5, high: 6}
        capped: false
        reasoning: >-
          The best fielded guided airdrop system lands within 50-75 m. With about 50 m of error across the road, the
          chance of landing within +/-4 m of the road's centre line is about 6% per car (1.2 MU). Five cars would give
          6 MU if independent; wind errors are shared, so the central estimate credits partial correlation.
        dependence: First component.
        references: [jpads-accuracy, c130-drop]
        credits: [{character: dom, role: controller}, {character: brian, role: controller}, {character: letty, role: controller}, {character: roman, role: controller}, {character: tej, role: controller}]
      - id: c2
        category: physics
        subtype: physics.mechanical
        claim: Each car lands on its tyres under a cargo parachute and drives off at once
        evidence: E4
        mu: {low: 1, central: 1.5, high: 2.5}
        capped: false
        reasoning: >-
          Cargo parachutes land at 7-9 m/s, like dropping a car from 3-4 m. Military airdrops land vehicles on
          crushable honeycomb platforms precisely because tyres and suspension fail. The production's own landing shots
          used cars on wires dropped 6-10 ft onto moving wheels. Judged 1 in 3 per car, correlated.
        dependence: Conditional on c1 (the car is over the road).
        references: [c130-drop]
        credits: [{character: dom, role: occupant}, {character: brian, role: occupant}, {character: letty, role: occupant}, {character: roman, role: occupant}, {character: tej, role: occupant}]
