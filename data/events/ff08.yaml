    in_universe_excuse: null
    visually_unverified: []
    confidence: medium
    participants: [letty, roman, tej, ramsey, hobbs, cipher]
    plot_sources: [ff08-wiki, ff08-fandom, ff08-artofvfx, ff08-vfxblog]
