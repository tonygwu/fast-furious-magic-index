      Cipher remotely takes over "over a thousand" cars across Manhattan, drives them into the Russian minister's
      motorcade, and sends cars off the upper floors of a parking garage onto the street.
    inferred: The production dropped seven real cars from a garage; the pile-up was 35-40 cars.
    post_credit: false
    in_universe_excuse: null
    visually_unverified: []
    confidence: high
    participants: [cipher, dom]
    plot_sources: [ff08-wiki, ff08-fandom, ff08-denofgeek, ff08-transcript]
    components:
      - id: c1
        category: skill
        subtype: skill.hacking
        claim: One crew gains full drive control of over a thousand mixed cars at once
        evidence: E4
        mu: {low: 2, central: 3, high: 3}
        capped: false
        reasoning: >-
          Real remote exploits are specific to one make and model (the 2015 Jeep hack took two researchers years).
          Experts called the scene "not a realistic representation of anything" and said this scale would need
          "Manhattan Project-style" effort. A stronger probability would be invented, so this is held at the 3 MU
          judgment cap.
        dependence: First component.
        references: [zero-day-count]
        credits: [{character: cipher, role: performer}]
      - id: c2
        category: coincidence
        subtype: coincidence.landing
        claim: Cars driven off a garage land on the moving motorcade
        evidence: E3
        mu: {low: 0.5, central: 1, high: 2}
        capped: false
        reasoning: >-
          A car rolling off a ledge travels only a few metres out; hitting moving vehicles below needs the release timed
          to the motorcade's position. With the hack granted, this is timing, judged about 1 in 10.
        dependence: Conditional on c1.
        references: []
        credits: [{character: cipher, role: controller}]
