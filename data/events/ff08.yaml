  - id: ev-ff08-04
    title: Hobbs redirects a torpedo by hand
    sequence: Arctic finale
    depicted: >-
      Leaning out of his vehicle at speed on the frozen lake, Hobbs grabs a live torpedo skidding across the ice and
      shoves it into another vehicle.
    inferred: ""
    post_credit: false
    in_universe_excuse: null
    visually_unverified: [deflection angle, whether Hobbs's vehicle matches the torpedo's speed]
    confidence: medium
    participants: [hobbs]
    plot_sources: [ff08-stunts, ff08-wrap-factcheck, owner-ff08-arctic]
    components:
      - id: c1
        category: physics
        subtype: physics.forces
        claim: One arm, from a moving vehicle, turns a 2 t torpedo moving at about 50 mph
        evidence: E2
        mu: {low: 3, central: 6, high: 12}
        capped: false
        reasoning: >-
          Lateral impulse F = m x v x sin(theta) / t, with m = 2 t and v = 22 m/s. The four corners of 3-10 degrees
          over 0.5-1 s give 2.3 kN, 4.6 kN, 7.6 kN and 15.3 kN. The heaviest deadlift ever is about 5 kN with both
          legs and ideal footing; a one-arm pull while leaning from a moving vehicle is perhaps 1-1.5 kN. The
          requirement is therefore 1.5x to 15x the plausible force: marginal at the gentlest corner, far beyond it at
          the sharpest. It is not capped because the gentlest corner, which is the assumption most favourable to the
          stunt, stays under 3x. The wide MU range is deliberate.
        dependence: First component.
        references: [type53-torpedo, deadlift-record]
        credits: [{character: hobbs, role: controller}]
      - id: c2
        category: coincidence
        subtype: coincidence.fuze
        claim: Grabbing the torpedo does not set it off, but hitting the target vehicle does
        evidence: E4
        mu: {low: 0.5, central: 1, high: 2}
        capped: false
        reasoning: Contact fuzes are built to fire on impacts far softer than a car collision; the ice skid, the grab and the hit form a narrow sequence. Judgment prior about 1 in 10.
        dependence: Conditional on c1.
        references: []
        credits: [{character: hobbs, role: beneficiary}]
