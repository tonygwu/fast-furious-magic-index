- {id: us-vehicle-trips-2017, quantity: "US vehicle trips per year (2017)", value: 220430000000, unit: trips/yr, basis: literature, source: nhts-2017, note: "Table 'Total vehicle trips' 233,030M (2001), 233,849M (2009), 220,430M (2017); extracted with pdftotext from the saved PDF"}
