- {id: record-horizon-basis, quantity: "Worldwide vehicle trips per year (order of magnitude)", value: 1000000000000, unit: trips/yr, basis: estimate, source: nhts-2017, note: "US 2.2e11 trips/yr x (world fleet / US fleet ~5.5) x (0.5-1 for lower per-vehicle use outside the US) = 0.6e12-1.2e12. The 12 MU cap = 1 in a trillion = roughly one year of every car trip on Earth."}
- {id: nhtsa-fatal-frontal, quantity: "P(fatal | delta-V) frontal crash", value: "logit = -9.0422 + 0.1571*D (D in mph)", unit: probability, basis: literature, source: nhtsa-813219, note: "Table 4-3; fit on 2010-2015 CDS with delta-V > 60 mph consolidated to 60, so any use above 60 mph is extrapolation"}
- {id: nhtsa-mais2-frontal, quantity: "P(MAIS2+ | delta-V) frontal crash", value: "logit = -4.9429 + 0.1425*D (D in mph)", unit: probability, basis: literature, source: nhtsa-813219, note: "Walk-away (MAIS 0-1) probability = 1 - P(MAIS2+). Used when a character is shown fully functional right after the crash."}
- {id: nhtsa-fatal-all, quantity: "P(fatal | delta-V) all crash modes", value: "logit = -8.9819 + 0.1603*D (D in mph)", unit: probability, basis: literature, source: nhtsa-813219, note: "Table 4-1"}
- {id: nhtsa-mais2-all, quantity: "P(MAIS2+ | delta-V) all crash modes", value: "logit = -5.1331 + 0.1479*D (D in mph)", unit: probability, basis: literature, source: nhtsa-813219, note: "Table 4-1"}
